# Personal productivity app — self-hosted stack (Kali homelab).
# Fully separate from ARCNIR: own Postgres, own volumes, own networks, own tunnel.
#
#   docker compose up -d --build                  # db + migrate + web + backup
#   docker compose run --rm tools npm run db:seed # one-off jobs (see README.md)
#   docker compose --profile tunnel up -d         # add Cloudflare Tunnel once the token exists

name: productivity

x-db-url: &db-url postgresql://hq:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/productivity

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: productivity
      TZ: ${APP_TIMEZONE:-America/Chicago}
    # Data lives in a visible folder next to this file. Postgres 18 mounts at /var/lib/postgresql.
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq -d productivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    # No ports: — the database is unreachable from outside Docker.

  migrate:
    build: { context: ./web, target: tools }
    image: productivity-tools
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  web:
    build: { context: ./web, target: runner }
    image: productivity-web
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?run npm run hash-password}
      OWNER_PASSWORD_SALT: ${OWNER_PASSWORD_SALT:?}
      OWNER_SESSION_SECRET: ${OWNER_SESSION_SECRET:?}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Chicago}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3100}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    # LAN/localhost access for testing. Default binds to the server itself only.
    ports:
      - "${WEB_BIND:-127.0.0.1}:3100:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, edge]

  backup:
    image: postgres:18
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: hq
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: productivity
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      TZ: ${APP_TIMEZONE:-America/Chicago}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]

  # One-off jobs: seed, vault import. Not started by `up`.
  tools:
    image: productivity-tools
    profiles: [tools]
    environment:
      DATABASE_URL: *db-url
      LIFEQUEST_VAULT: /vault
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Chicago}
    volumes:
      - ${LIFEQUEST_VAULT_HOST:-./vault-missing}:/vault
      - ./vault-backups:/app/vault-backups
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on: [web]
    networks: [edge]

networks:
  backend:
    internal: true   # db, migrations, backups: no internet in or out
  edge: {}           # web + cloudflared
